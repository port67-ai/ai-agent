name: Isolated baseline verification
on:
  push:
    branches:
      - recovery/verified-baseline-2026-11-21
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact last-live baseline (not PR merge)
        uses: actions/checkout@v4
        with:
          ref: bebcdecc1af47b2b2a68f037263eca7faf9fbe42
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:firestore
      - run: npm run check:factory
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/port67-baseline-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/factory/session > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-browser-screenshots
          path: work/screenshots
